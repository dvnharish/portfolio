name: Build and deploy to Hostinger

# Hostinger shared hosting is Apache/LiteSpeed with no Node runtime, so the
# build has to happen here and only the static `out/` directory is uploaded.
on:
  push:
    branches: [main]
  # Lets you re-deploy without a code change (e.g. after rotating FTP creds).
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# Never let two deploys interleave over FTP - a half-uploaded site is worse
# than a stale one. Queue instead of cancelling, so the last push always wins.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm run verify` uses --experimental-strip-types, which
          # only exists from Node 22.6.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Overlay timing contract
        run: npm run verify

  deploy:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    # Needed to force-push the built site to the `deploy` branch.
    permissions:
      contents: write
    # Create this environment in repo Settings to add a manual approval gate.
    environment: production
    # Secrets are surfaced as env vars because the `secrets` context is NOT
    # available in a step-level `if:` - referencing it there makes the whole
    # workflow file invalid ("Unrecognized named-value: 'secrets'"), so nothing
    # runs at all. `env` is available in `if`, so the optional FTP step is gated
    # on these instead.
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prebuild regenerates the frame manifest, image derivatives and OG card.
      # postbuild audits the export: fails on a leaked localhost URL or any
      # missing required file. public/.htaccess is copied by Next itself.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://harishduddupudi.com' }}

      # Cheap insurance: the deploy is worthless without these, and a silent
      # miss is hard to spot on a live site.
      - name: Assert critical files exist
        run: |
          for f in index.html 404.html .htaccess robots.txt sitemap.xml og.jpg; do
            test -f "out/$f" || { echo "::error::out/$f missing"; exit 1; }
          done
          echo "out/ contains $(find out -type f | wc -l) files, $(du -sh out | cut -f1)"

      # ---------------------------------------------------------------------
      # Primary: publish the built site to a `deploy` branch whose ROOT is the
      # site root, then let Hostinger's Git integration pull that branch.
      #
      # Hostinger checks a repo out into public_html verbatim. Pointing it at
      # `main` would serve the site from /out/ instead of /, leave .htaccess at
      # public/.htaccess where Apache ignores it, and expose package.json,
      # next.config.mjs and scripts/ publicly. A branch containing only out/'s
      # contents makes the checkout itself the correct document root.
      #
      # Uses the built-in GITHUB_TOKEN, so this needs no secrets at all. Each
      # run is a fresh single-commit orphan history, so the branch never grows.
      # ---------------------------------------------------------------------
      - name: Publish built site to deploy branch
        run: |
          cd out
          git init -q
          git checkout -qb deploy
          # Byte-for-byte fidelity. This branch carries build artifacts, not
          # source: line-ending normalisation must never touch minified JS or
          # .htaccess. Set explicitly so the result cannot depend on the
          # runner's git defaults.
          git config core.autocrlf false
          git config core.eol lf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            deploy
          echo "Published $(git ls-files | wc -l) files to the 'deploy' branch."

      # Optional second channel. Runs only if the FTP secrets are configured, so
      # the Git-based deploy above works with no setup.
      - name: Upload to Hostinger over FTPS
        if: env.FTP_HOST != ''
        # Pinned to a release tag. This action receives your FTP credentials, so
        # pinning to a commit SHA instead is stronger - see README.
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          # A repo VARIABLE, not a secret: it is not sensitive, and secrets are
          # masked in logs - which is exactly what you need to see when the path
          # is wrong. Override in Settings > Variables if your FTP user lands
          # inside the site root rather than above it.
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          # Incremental: the action keeps a state file on the server and uploads
          # only what changed, so the 89-frame sequence is not re-sent every time.
          # `dangerous-clean-slate` is deliberately NOT set - it would wipe
          # public_html on every run.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
