name: Build and deploy to Hostinger

# Hostinger shared hosting is Apache/LiteSpeed with no Node runtime, so the
# build has to happen here and only the static `out/` directory is uploaded.
on:
  push:
    branches: [main]
  # Lets you re-deploy without a code change (e.g. after rotating FTP creds).
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# Never let two deploys interleave over FTP - a half-uploaded site is worse
# than a stale one. Queue instead of cancelling, so the last push always wins.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm run verify` uses --experimental-strip-types, which
          # only exists from Node 22.6.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Overlay timing contract
        run: npm run verify

  deploy:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    # Needed to force-push the built site to the `deploy` branch.
    permissions:
      contents: write
    # Create this environment in repo Settings to add a manual approval gate.
    environment: production
    # Secrets are surfaced as env vars because the `secrets` context is NOT
    # available in a step-level `if:` - referencing it there makes the whole
    # workflow file invalid ("Unrecognized named-value: 'secrets'"), so nothing
    # runs at all. `env` is available in `if`, so the optional FTP step is gated
    # on these instead.
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prebuild regenerates the frame manifest, image derivatives and OG card.
      # postbuild audits the export: fails on a leaked localhost URL or any
      # missing required file. public/.htaccess is copied by Next itself.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://harishduddupudi.com' }}

      # Cheap insurance: the deploy is worthless without these, and a silent
      # miss is hard to spot on a live site.
      - name: Assert critical files exist
        run: |
          for f in index.html 404.html .htaccess robots.txt sitemap.xml og.jpg; do
            test -f "out/$f" || { echo "::error::out/$f missing"; exit 1; }
          done
          echo "out/ contains $(find out -type f | wc -l) files, $(du -sh out | cut -f1)"

      # ---------------------------------------------------------------------
      # PRIMARY deploy: straight into public_html over FTPS.
      #
      # This runs BEFORE the deploy-branch step on purpose. That step creates a
      # .git directory inside out/, and uploading a pristine out/ is safer than
      # relying on an exclude pattern to skip it.
      #
      # Hostinger's own Git/build integration was tried and abandoned: its
      # Next.js preset strips output:'export' and builds a server app, and its
      # static preset published nothing at all. FTP bypasses that pipeline
      # entirely - no framework preset, no build command, no output directory.
      #
      # Skipped automatically until the FTP secrets exist, so the repo is never
      # in a broken state waiting on configuration.
      # ---------------------------------------------------------------------
      # Echoed so a wrong path is obvious in the log. FTP_SERVER_DIR is a
      # variable rather than a secret precisely so it is not masked here.
      - name: Show FTP target
        if: env.FTP_HOST != ''
        run: |
          echo "server-dir : ${{ vars.FTP_SERVER_DIR || '/public_html/' }}"
          echo "local-dir  : ./out/  ($(find out -type f | wc -l) files)"
          echo
          echo "If the upload below fails with a directory error, your FTP user"
          echo "probably lands INSIDE the site root. Add a repository VARIABLE"
          echo "named FTP_SERVER_DIR with the value ./ and re-run."

      # Reports the SHAPE of each credential, never its value. A trailing
      # newline picked up while copying is invisible in the GitHub UI and
      # produces "530 Login incorrect" with otherwise-correct credentials, so
      # length and surrounding whitespace are the two things worth seeing.
      - name: Check credential shape (no values printed)
        if: env.FTP_HOST != ''
        run: |
          report() {
            name="$1"; value="$2"
            len=${#value}
            trimmed=$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            tlen=${#trimmed}
            note="ok"
            [ "$len" -eq 0 ] && note="EMPTY - secret is not set or name is misspelt"
            [ "$len" -ne "$tlen" ] && note="LEADING/TRAILING WHITESPACE - re-enter this secret"
            case "$value" in *"$(printf '\r')"*) note="CONTAINS CARRIAGE RETURN - re-enter this secret";; esac
            printf '  %-13s chars=%-4s trimmed=%-4s %s\n' "$name" "$len" "$tlen" "$note"
          }
          report FTP_HOST "$FTP_HOST"
          report FTP_USERNAME "$FTP_USERNAME"
          report FTP_PASSWORD "$FTP_PASSWORD"
          echo
          case "$FTP_USERNAME" in
            *@*|*.*) echo "  username contains '@' or '.' - matches Hostinger's usual format" ;;
            *) echo "  username has no '@' or '.' - Hostinger FTP usernames are normally" ;
               echo "  like u609197946.yourdomain.com or deploy@yourdomain.com. Confirm you" ;
               echo "  copied it verbatim from hPanel > Files > FTP Accounts." ;;
          esac

      - name: Upload to Hostinger over FTPS
        if: env.FTP_HOST != ''
        # Pinned to a release tag. This action receives your FTP credentials, so
        # pinning to a commit SHA instead is stronger - see README.
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          # A repo VARIABLE, not a secret: it is not sensitive, and secrets are
          # masked in logs - which is exactly what you need to see when the path
          # is wrong. Override in Settings > Variables if your FTP user lands
          # inside the site root rather than above it.
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          # Incremental: the action keeps a state file on the server and uploads
          # only what changed, so the 89-frame sequence is not re-sent every time.
          # `dangerous-clean-slate` is deliberately NOT set - it would wipe
          # public_html on every run.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # ---------------------------------------------------------------------
      # Secondary: also publish the built site to a `deploy` branch whose ROOT is
      # the site root. Not currently consumed by Hostinger, but it keeps a
      # deployable artifact in the repo and makes any Git-based host trivial to
      # point at later. Uses the built-in GITHUB_TOKEN, so it needs no secrets.
      # Each run is a fresh single-commit orphan history, so it never grows.
      # ---------------------------------------------------------------------
      - name: Publish built site to deploy branch
        run: |
          cd out
          git init -q
          git checkout -qb deploy
          # Byte-for-byte fidelity. This branch carries build artifacts, not
          # source: line-ending normalisation must never touch minified JS or
          # .htaccess. Set explicitly so the result cannot depend on the
          # runner's git defaults.
          git config core.autocrlf false
          git config core.eol lf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            deploy
          echo "Published $(git ls-files | wc -l) files to the 'deploy' branch."
